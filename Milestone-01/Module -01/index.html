<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <a href="image.png" download="picture">Plase download🡻</a>
    <fieldset>
        <legend>11</legend>
        11
    </fieldset>
    <dl>
        <dt>Wow</dt>
        <dd>Hello</dd>
    </dl>


    <form action="#">
        <div class="input-group">
            <input type="text" id="name" required>
            <label for="name">Your name</label>
        </div>
    </form>

    <style>
        .input-group {
            position: relative;
            width: 300px;
            margin-top: 20px;
        }

        .input-group input {
            width: 100%;
            height: 24px;
            border: 1px solid #1dce1d;
            outline: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 10px;
            color: #777;
            font-size: 14px;
            transform: translateY(-50%);
            background: white;
            padding: 0 6px;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .input-group input:focus+label,
        .input-group input:valid+label {
            top: 0;
            font-size: 12px;
            color: #ce1d1d;
        }
        .input-group input:focus {
            border-color: #ce1d1d;
        }
    </style>
</body>

</html>
